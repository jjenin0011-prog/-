<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أرشيف الذاكرة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
          font-family: 'Cairo', sans-serif;
        }

        body {
          background-color: #0b0b0e;
          color: #ffffff;
          padding: 10px;
          direction: rtl;
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
        }

        .phone-mockup {
          width: 100%;
          max-width: 420px;
          background-color: #111116;
          border-radius: 28px;
          border: 1px solid rgba(255, 255, 255, 0.08);
          box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(136, 19, 25, 0.25);
          overflow: hidden;
          position: relative;
        }

        .ambient-glow {
          position: absolute;
          top: -100px;
          right: 50%;
          transform: translateX(50%);
          width: 320px;
          height: 320px;
          background: radial-gradient(circle, rgba(153, 27, 27, 0.35) 0%, rgba(120, 0, 0, 0.12) 50%, transparent 75%);
          filter: blur(45px);
          pointer-events: none;
        }

        .top-nav {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 18px 22px;
          background: rgba(17, 17, 22, 0.85);
          border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-brand {
          font-size: 11pt;
          font-weight: 900;
          color: #f3f4f6;
        }

        .nav-brand .accent {
          color: #991b1b;
          font-weight: 400;
        }

        .audio-pill {
          background: linear-gradient(135deg, rgba(153, 27, 27, 0.3), rgba(120, 0, 0, 0.15));
          border: 1px solid rgba(153, 27, 27, 0.5);
          color: #fecdd3;
          padding: 6px 14px;
          border-radius: 30px;
          font-size: 8.5pt;
          font-weight: 600;
          cursor: pointer;
          user-select: none;
          transition: all 0.2s ease;
        }

        .audio-pill.playing {
          background: #991b1b;
          color: #ffffff;
          box-shadow: 0 0 10px rgba(153, 27, 27, 0.6);
        }

        .editorial-hero {
          padding: 24px 22px 16px;
          text-align: right;
        }

        .kicker {
          display: inline-block;
          font-size: 8pt;
          font-weight: 700;
          color: #dc2626;
          background: rgba(153, 27, 27, 0.18);
          padding: 4px 12px;
          border-radius: 4px;
          border-right: 3px solid #991b1b;
          margin-bottom: 10px;
        }

        .hero-heading {
          font-size: 20pt;
          font-weight: 900;
          line-height: 1.2;
          color: #ffffff;
          margin-bottom: 8px;
        }

        .hero-quote {
          font-size: 9pt;
          color: #9ca3af;
          line-height: 1.5;
          border-right: 2px solid rgba(153, 27, 27, 0.7);
          padding-right: 10px;
          margin-bottom: 16px;
        }

        .toolbar-area {
          padding: 0 22px 16px;
        }

        .custom-input {
          width: 100%;
          padding: 12px 14px;
          background-color: rgba(255, 255, 255, 0.05);
          border: 1px solid rgba(255, 255, 255, 0.15);
          border-radius: 10px;
          color: #ffffff;
          font-size: 9pt;
          margin-bottom: 10px;
          outline: none;
        }

        .custom-input:focus {
          border-color: #991b1b;
          box-shadow: 0 0 8px rgba(153, 27, 27, 0.4);
        }

        .chip-group {
          display: flex;
          gap: 6px;
        }

        .chip {
          flex: 1;
          text-align: center;
          padding: 8px 4px;
          font-size: 8.5pt;
          color: #9ca3af;
          background: rgba(255, 255, 255, 0.02);
          border: 1px solid rgba(255, 255, 255, 0.05);
          border-radius: 8px;
          font-weight: 600;
          cursor: pointer;
          transition: all 0.2s ease;
        }

        .chip.active {
          background: #7f1d1d;
          color: #ffffff;
          border: 1px solid #991b1b;
          box-shadow: 0 4px 14px rgba(127, 29, 29, 0.5);
        }

        .feed-area {
          padding: 0 22px 28px;
          min-height: 220px;
        }

        /* تصميم البطاقة مع الصورة */
        .hero-card {
          background: linear-gradient(145deg, rgba(28, 28, 36, 0.95) 0%, rgba(15, 15, 20, 0.98) 100%);
          border: 1px solid rgba(255, 255, 255, 0.08);
          border-radius: 16px;
          padding: 16px;
          margin-bottom: 16px;
          position: relative;
          box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .hero-card::after {
          content: '';
          position: absolute;
          top: 0;
          right: 0;
          width: 100%;
          height: 3px;
          background: linear-gradient(90deg, #991b1b 0%, transparent 85%);
          border-radius: 16px 16px 0 0;
        }

        .card-top-section {
          display: flex;
          gap: 12px;
          align-items: flex-start;
          margin-bottom: 12px;
        }

        .martyr-img-wrapper {
          width: 75px;
          height: 95px;
          border-radius: 10px;
          overflow: hidden;
          border: 1px solid rgba(153, 27, 27, 0.5);
          flex-shrink: 0;
          background: #1a1a22;
        }

        .martyr-img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          filter: grayscale(20%) contrast(105%);
        }

        .card-header-info {
          flex: 1;
        }

        .card-tag-row {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 4px;
        }

        .card-tag {
          font-size: 7.5pt;
          color: #ef4444;
          font-weight: 700;
          background: rgba(239, 68, 68, 0.1);
          padding: 2px 8px;
          border-radius: 4px;
        }

        .card-title-text {
          font-size: 12pt;
          font-weight: 900;
          color: #ffffff;
          line-height: 1.3;
          margin-bottom: 2px;
        }

        .card-nickname {
          font-size: 8pt;
          color: #dc2626;
          font-weight: 700;
          margin-bottom: 4px;
        }

        .card-dates-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 6px;
          background: rgba(255, 255, 255, 0.03);
          border: 1px solid rgba(255, 255, 255, 0.05);
          border-radius: 8px;
          padding: 8px 10px;
          margin-bottom: 10px;
          font-size: 7.5pt;
          color: #9ca3af;
        }

        .card-dates-grid div span {
          color: #d1d5db;
          font-weight: 600;
          display: block;
        }

        .card-details {
          font-size: 8pt;
          color: #e5e7eb;
          margin-bottom: 8px;
          line-height: 1.4;
        }

        .card-story {
          font-size: 8pt;
          color: #9ca3af;
          line-height: 1.6;
          background: rgba(0, 0, 0, 0.25);
          padding: 10px;
          border-radius: 8px;
          border-right: 2px solid #991b1b;
        }

        .empty-placeholder {
          text-align: center;
          color: #6b7280;
          padding: 40px 20px;
          font-size: 9pt;
          border: 1px dashed rgba(255, 255, 255, 0.08);
          border-radius: 16px;
        }
    </style>
</head>
<body>

    <audio id="bgAudio" preload="auto" loop src="song.mp3.mp3"></audio>

    <div class="phone-mockup">
        <div class="ambient-glow"></div>

        <div class="top-nav">
            <div class="nav-brand">أرشيف <span class="accent">الذاكرة</span></div>
            <div class="audio-pill" id="audioBtn" onclick="toggleAudio()">♪ الخلفية الصوتية</div>
        </div>

        <div class="editorial-hero">
            <div class="kicker">مشروع توثيق إعلامي</div>
            <div class="hero-heading">شهداؤنا<br>ليسوا أرقاماً</div>
            <div class="hero-quote">«لكل اسم حكاية، ولكل شهيد ذاكرة لا تُنسى.»</div>
        </div>

        <div class="toolbar-area">
            <input type="text" id="searchInput" class="custom-input" placeholder="🔍 ابحث بالاسم، القصة، أو تاريخ الاستشهاد..." oninput="filterData()">
            <div class="chip-group">
                <div class="chip active" onclick="setFilter('الكل', this)">الكل</div>
                <div class="chip" onclick="setFilter('جنين', this)">جنين</div>
                <div class="chip" onclick="setFilter('نابلس', this)">نابلس</div>
                <div class="chip" onclick="setFilter('الخليل', this)">الخليل</div>
            </div>
        </div>

        <div class="feed-area" id="feedArea">
            <!-- سيتم تحميل البطاقات العشوائية هنا تلقائياً -->
        </div>
    </div>

    <script>
        // قاعدة البيانات مع روابط الصور
        const records = [
          {
            name: "إبراهيم أحمد سعيد النابلسي",
            nickname: "أبو فتحي / أمير كتائب شهداء الأقصى",
            city: "نابلس",
            location: "البلدة القديمة - نابلس",
            image: "https://upload.wikimedia.org/wikipedia/ar/0/03/%D8%A5%D8%A8%D8%B1%D8%A7%D9%87%D9%8A%D9%85_%D8%A7%D9%84%D9%86%D8%A7%D8%A8%D9%84%D8%B3%D9%8A.jpg",
            birthDate: "2003/10/13",
            deathDate: "2022/08/09",
            howMartyred: "اشتباك مسلح حاسم عقب حصار منزل في الحارة الشرقية بالبلدة القديمة",
            story: "شاب مطارد أربك أجهزة الاحتلال لشهور طويلة ونجا من عدة محاولات اغتيال. أصبح رمزاً للشباب المقاوم في نابلس وشكّل حالة نضالية فريدة حتى لحظة استشهاده رفقة رفيقه إسلام صبوح."
          },
          {
            name: "محمود أحمد محمد طوالبة",
            nickname: "قائد معركة مخيم جنين 2002",
            city: "جنين",
            location: "مخيم جنين",
            image: "https://upload.wikimedia.org/wikipedia/ar/8/87/Mahmoud_Tawalbe.jpg",
            birthDate: "1979/11/02",
            deathDate: "2002/04/09",
            howMartyred: "اشتباك مباشر وتفجير منزل أثناء دفاعه عن المخيم خلال عملية السور الواقي",
            story: "القائد الميداني المباشر لمعركة مخيم جنين الشهيرة عام 2002. أدار غرفة عمليات المقاومة وواجه الدبابات والجرافات بحنكة عسكرية عالية وقاد الصمود حتى استشهاده."
          },
          {
            name: "مروان خليل زلوم",
            nickname: "قائد كتائب شهداء الأقصى في الخليل",
            city: "الخليل",
            location: "شارع الشلالة - الخليل",
            image: "", // اتركيه فارغاً إذا لم تتوفر صورة ليتم استخدام صورة افتراضية
            birthDate: "1972/06/15",
            deathDate: "2002/04/22",
            howMartyred: "اغتيال بواسطة صواريخ أطلقتها طائرة أباتشي استهدفت سيارته",
            story: "من أوائل مؤسسي وصانعي المجموعات العسكرية في الخليل خلال انتفاضة الأقصى. خطط ونفذ عدة عمليات نوعية وكان مطارداً لفترة طويلة وقاد العمل المقاوم في المحافظة."
          },
          {
            name: "عبد الله أنور حصري",
            nickname: "مؤسس في كتيبة جنين",
            city: "جنين",
            location: "مخيم جنين",
            image: "",
            birthDate: "1999/08/18",
            deathDate: "2022/03/01",
            howMartyred: "اشتباك مسلح مباشر مع القوات الخاصة الإسرائيلية أثناء تصديه للاقتحام",
            story: "أسير محرر ومقاوم بارز كان من الأوائل الذين أسسوا العمل الميداني والتصدّي للاقتحامات الليلية لمخيم جنين. اشتُهر بجرأته في المواجهة المباشرة من مسافات صفر."
          },
          {
            name: "إسلام أحمد صبوح",
            nickname: "صقر البلدة القديمة",
            city: "نابلس",
            location: "البلدة القديمة - نابلس",
            image: "",
            birthDate: "2000/02/10",
            deathDate: "2022/08/09",
            howMartyred: "استشهد مقاتلاً برفقة إبراهيم النابلسي بعد حصار طويل واشتباك عنيف",
            story: "رفيق درب إبراهيم النابلسي، أحد أبرز المطاردين والمقاتلين في البلدة القديمة بنابلس. خاض المعركة الأخيرة حتى نفاد ذخيرته ولم يسلم نفسه رغم القصف المكثف."
          },
          {
            name: "نسيم نايف سليم أبو فودة",
            nickname: "فارس الحرم الإبراهيمي",
            city: "الخليل",
            location: "المنطقة الجنوبية - الخليل",
            image: "",
            birthDate: "1997/04/25",
            deathDate: "2023/01/30",
            howMartyred: "إصابة مباشرة بالرصاص الحي في الرأس عند حاجز عسكري قرب الحرم",
            story: "شاب من سكان منطقة الحرم الإبراهيمي بالخليل، استُهدف بدم بارد أثناء مروره بسيارته قرب إحدى المكعبات الإسمنتية التي تقطع أوصال المدينة القديمة."
          }
        ];

        let currentCity = 'الكل';

        function getRandomRecords(arr, count) {
            const shuffled = [...arr].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, count);
        }

        function renderCards(data) {
            const feed = document.getElementById('feedArea');
            feed.innerHTML = '';

            if (data.length === 0) {
                feed.innerHTML = '<div class="empty-placeholder">لم يتم العثور على سجلات مطابقة لنص البحث.</div>';
                return;
            }

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'hero-card';

                // في حال عدم وجود صورة، نستخدم صورة نمطية أو رمزية
                const imageUrl = item.image && item.image.trim() !== "" 
                    ? item.image 
                    : "https://via.placeholder.com/150/1c1c24/888888?text=%D8%A7%D9%84%D8%B0%D8%A7%D9%83%D8%B1%D8%A9";

                card.innerHTML = `
                    <div class="card-top-section">
                        <div class="martyr-img-wrapper">
                            <img src="${imageUrl}" alt="${item.name}" class="martyr-img" onerror="this.src='https://via.placeholder.com/150/1c1c24/888888?text=%D8%A7%D9%84%D8%B0%D8%A7%D9%83%D8%B1%D8%A9'">
                        </div>
                        <div class="card-header-info">
                            <div class="card-tag-row">
                                <span class="card-tag">${item.location}</span>
                                <span style="font-size: 7.5pt; color: #6b7280;">مدينة ${item.city}</span>
                            </div>
                            <div class="card-title-text">${item.name}</div>
                            ${item.nickname ? `<div class="card-nickname">• ${item.nickname}</div>` : ''}
                        </div>
                    </div>
                    
                    <div class="card-dates-grid">
                        <div>الميلاد: <span>${item.birthDate || 'غير مدون'}</span></div>
                        <div>الاستشهاد: <span>${item.deathDate}</span></div>
                    </div>

                    <div class="card-details">
                        <strong style="color: #f87171;">تفاصيل الاستشهاد:</strong> ${item.howMartyred}
                    </div>

                    ${item.story ? `
                    <div class="card-story">
                        <strong style="color: #ffffff; display: block; margin-bottom: 2px;">قصة الشهيد:</strong>
                        ${item.story}
                    </div>` : ''}
                `;
                feed.appendChild(card);
            });
        }

        function updateDisplay() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();

            let cityFiltered = records;
            if (currentCity !== 'الكل') {
                cityFiltered = records.filter(r => r.city === currentCity);
            }

            if (query.length > 0) {
                const searchResults = cityFiltered.filter(item => 
                    item.name.toLowerCase().includes(query) ||
                    (item.nickname && item.nickname.toLowerCase().includes(query)) ||
                    item.location.toLowerCase().includes(query) ||
                    (item.story && item.story.toLowerCase().includes(query)) ||
                    item.deathDate.includes(query)
                );
                renderCards(searchResults);
            } else {
                const randomSelection = getRandomRecords(cityFiltered, 3);
                renderCards(randomSelection);
            }
        }

        function filterData() {
            updateDisplay();
        }

        function setFilter(city, element) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            currentCity = city;
            
            document.getElementById('searchInput').value = '';
            updateDisplay();
        }

        function toggleAudio() {
            const audio = document.getElementById('bgAudio');
            const btn = document.getElementById('audioBtn');

            if (audio.paused) {
                audio.load();
                let playPromise = audio.play();

                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        btn.classList.add('playing');
                        btn.innerText = '⏸ إيقاف الصوت';
                    }).catch(error => {
                        console.log(error);
                        alert('يرجى الضغط مرة أخرى لتأكيد تشغيل الصوت.');
                    });
                }
            } else {
                audio.pause();
                btn.classList.remove('playing');
                btn.innerText = '♪ الخلفية الصوتية';
            }
        }

        window.onload = function() {
            updateDisplay();
        };
    </script>
</body>
</html>

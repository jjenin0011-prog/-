<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- كود إثبات الملكية الخاص بـ Google Search Console -->
    <meta name="google-site-verification" content="CPGrqBveMH0hfyyo5ob9plnh9qkCF95W3pxLx8mKnEQ" />

    <title>أرشيف الذاكرة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
          font-family: 'Cairo', sans-serif;
        }

        body {
          background-color: #0b0b0e;
          color: #ffffff;
          padding: 10px;
          direction: rtl;
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
        }

        .phone-mockup {
          width: 100%;
          max-width: 420px;
          background-color: #111116;
          border-radius: 28px;
          border: 1px solid rgba(255, 255, 255, 0.08);
          box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(136, 19, 25, 0.25);
          overflow: hidden;
          position: relative;
        }

        .ambient-glow {
          position: absolute;
          top: -100px;
          right: 50%;
          transform: translateX(50%);
          width: 320px;
          height: 320px;
          background: radial-gradient(circle, rgba(153, 27, 27, 0.35) 0%, rgba(120, 0, 0, 0.12) 50%, transparent 75%);
          filter: blur(45px);
          pointer-events: none;
        }

        .top-nav {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 18px 22px;
          background: rgba(17, 17, 22, 0.85);
          border-bottom: 1px solid rgba(255, 255, 255, 0.05);
          position: relative;
        }

        .nav-brand {
          font-size: 11pt;
          font-weight: 900;
          color: #f3f4f6;
        }

        .nav-brand .accent {
          color: #991b1b;
          font-weight: 400;
        }

        .nav-controls {
          display: flex;
          gap: 8px;
          align-items: center;
        }

        .audio-pill {
          background: linear-gradient(135deg, rgba(153, 27, 27, 0.3), rgba(120, 0, 0, 0.15));
          border: 1px solid rgba(153, 27, 27, 0.5);
          color: #fecdd3;
          padding: 6px 12px;
          border-radius: 30px;
          font-size: 8pt;
          font-weight: 600;
          cursor: pointer;
          user-select: none;
          transition: all 0.2s ease;
        }

        .audio-pill.playing {
          background: #991b1b;
          color: #ffffff;
          box-shadow: 0 0 10px rgba(153, 27, 27, 0.6);
        }

        /* تنسيق قائمة الثلاث نقاط */
        .menu-wrapper {
          position: relative;
        }

        .menu-btn {
          background: rgba(255, 255, 255, 0.05);
          border: 1px solid rgba(255, 255, 255, 0.1);
          color: #fff;
          width: 32px;
          height: 32px;
          border-radius: 50%;
          display: flex;
          justify-content: center;
          align-items: center;
          font-size: 16px;
          cursor: pointer;
          transition: all 0.2s ease;
        }

        .menu-btn:hover {
          background: rgba(153, 27, 27, 0.3);
          border-color: rgba(153, 27, 27, 0.5);
        }

        .dropdown-menu {
          display: none;
          position: absolute;
          left: 0;
          top: 40px;
          background: #1a1a24;
          border: 1px solid rgba(255, 255, 255, 0.12);
          border-radius: 12px;
          padding: 12px;
          width: 190px;
          box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
          z-index: 1000;
          text-align: right;
        }

        .dropdown-menu p {
          font-size: 8pt;
          color: #9ca3af;
          margin-bottom: 2px;
        }

        .dropdown-menu .email-link {
          display: block;
          font-size: 8.5pt;
          color: #60a5fa;
          font-weight: 700;
          margin-bottom: 8px;
          word-break: break-all;
          text-decoration: none;
        }

        .dropdown-menu .email-link:hover {
          text-decoration: underline;
        }

        .dropdown-menu hr {
          border: 0;
          border-top: 1px solid rgba(255, 255, 255, 0.08);
          margin: 8px 0;
        }

        .dropdown-menu a.action-link {
          display: block;
          text-decoration: none;
          color: #ef4444;
          font-size: 9pt;
          font-weight: 700;
          transition: color 0.2s;
        }

        .dropdown-menu a.action-link:hover {
          color: #f87171;
        }

        .editorial-hero {
          padding: 24px 22px 16px;
          text-align: right;
        }

        .kicker {
          display: inline-block;
          font-size: 8pt;
          font-weight: 700;
          color: #dc2626;
          background: rgba(153, 27, 27, 0.18);
          padding: 4px 12px;
          border-radius: 4px;
          border-right: 3px solid #991b1b;
          margin-bottom: 10px;
        }

        .hero-heading {
          font-size: 20pt;
          font-weight: 900;
          line-height: 1.2;
          color: #ffffff;
          margin-bottom: 8px;
        }

        .hero-quote {
          font-size: 9pt;
          color: #9ca3af;
          line-height: 1.5;
          border-right: 2px solid rgba(153, 27, 27, 0.7);
          padding-right: 10px;
          margin-bottom: 16px;
        }

        .toolbar-area {
          padding: 0 22px 16px;
        }

        .custom-input {
          width: 100%;
          padding: 12px 14px;
          background-color: rgba(255, 255, 255, 0.05);
          border: 1px solid rgba(255, 255, 255, 0.15);
          border-radius: 10px;
          color: #ffffff;
          font-size: 9pt;
          margin-bottom: 10px;
          outline: none;
        }

        .custom-input:focus {
          border-color: #991b1b;
          box-shadow: 0 0 8px rgba(153, 27, 27, 0.4);
        }

        .chip-group {
          display: flex;
          gap: 6px;
        }

        .chip {
          flex: 1;
          text-align: center;
          padding: 8px 4px;
          font-size: 8.5pt;
          color: #9ca3af;
          background: rgba(255, 255, 255, 0.02);
          border: 1px solid rgba(255, 255, 255, 0.05);
          border-radius: 8px;
          font-weight: 600;
          cursor: pointer;
          transition: all 0.2s ease;
        }

        .chip.active {
          background: #7f1d1d;
          color: #ffffff;
          border: 1px solid #991b1b;
          box-shadow: 0 4px 14px rgba(127, 29, 29, 0.5);
        }

        .feed-area {
          padding: 0 22px 28px;
          min-height: 220px;
        }

        .hero-card {
          background: linear-gradient(145deg, rgba(28, 28, 36, 0.95) 0%, rgba(15, 15, 20, 0.98) 100%);
          border: 1px solid rgba(255, 255, 255, 0.08);
          border-radius: 16px;
          padding: 14px;
          margin-bottom: 14px;
          position: relative;
          cursor: pointer;
          transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .hero-card:active {
          transform: scale(0.98);
        }

        .hero-card:hover {
          border-color: rgba(153, 27, 27, 0.6);
        }

        .card-top-section {
          display: flex;
          gap: 12px;
          align-items: center;
        }

        .martyr-img-wrapper {
          width: 65px;
          height: 80px;
          border-radius: 8px;
          overflow: hidden;
          border: 1px solid rgba(153, 27, 27, 0.5);
          flex-shrink: 0;
          background: #1a1a22;
        }

        .martyr-img {
          width: 100%;
          height: 100%;
          object-fit: cover;
        }

        .card-header-info {
          flex: 1;
        }

        .card-tag {
          font-size: 7pt;
          color: #ef4444;
          font-weight: 700;
          background: rgba(239, 68, 68, 0.1);
          padding: 2px 6px;
          border-radius: 4px;
          display: inline-block;
          margin-bottom: 4px;
        }

        .card-title-text {
          font-size: 11.5pt;
          font-weight: 900;
          color: #ffffff;
          margin-bottom: 2px;
        }

        .card-nickname {
          font-size: 8pt;
          color: #dc2626;
          font-weight: 600;
        }

        .view-more-btn {
          margin-top: 10px;
          width: 100%;
          padding: 8px;
          background: rgba(153, 27, 27, 0.15);
          border: 1px solid rgba(153, 27, 27, 0.4);
          color: #fca5a5;
          font-size: 8pt;
          font-weight: 700;
          border-radius: 8px;
          text-align: center;
        }

        .modal-overlay {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: rgba(0, 0, 0, 0.85);
          backdrop-filter: blur(8px);
          z-index: 9999;
          display: flex;
          justify-content: center;
          align-items: center;
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.3s ease;
          padding: 15px;
        }

        .modal-overlay.active {
          opacity: 1;
          pointer-events: auto;
        }

        .modal-content {
          width: 100%;
          max-width: 390px;
          max-height: 85vh;
          background: #121218;
          border: 1px solid rgba(255, 255, 255, 0.12);
          border-radius: 20px;
          padding: 20px;
          overflow-y: auto;
          position: relative;
          box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
          transform: translateY(20px);
          transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-content {
          transform: translateY(0);
        }

        .modal-close-btn {
          position: absolute;
          top: 15px;
          left: 15px;
          width: 32px;
          height: 32px;
          background: rgba(255, 255, 255, 0.1);
          color: #ffffff;
          border: none;
          border-radius: 50%;
          font-size: 14pt;
          cursor: pointer;
          display: flex;
          justify-content: center;
          align-items: center;
        }

        .modal-hero-img-box {
          width: 100%;
          height: 220px;
          border-radius: 12px;
          overflow: hidden;
          margin-bottom: 16px;
          border: 1px solid rgba(153, 27, 27, 0.4);
        }

        .modal-hero-img {
          width: 100%;
          height: 100%;
          object-fit: cover;
        }

        .modal-title {
          font-size: 16pt;
          font-weight: 900;
          color: #ffffff;
          margin-bottom: 4px;
          line-height: 1.3;
        }

        .modal-nickname {
          font-size: 10pt;
          color: #ef4444;
          font-weight: 700;
          margin-bottom: 16px;
        }

        .modal-info-grid {
          background: rgba(255, 255, 255, 0.03);
          border: 1px solid rgba(255, 255, 255, 0.06);
          border-radius: 10px;
          padding: 12px;
          margin-bottom: 16px;
          font-size: 8.5pt;
          color: #d1d5db;
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 10px;
        }

        .modal-info-item span {
          display: block;
          color: #9ca3af;
          font-size: 7.5pt;
          margin-bottom: 2px;
        }

        .modal-story-box {
          background: rgba(0, 0, 0, 0.4);
          border-right: 3px solid #991b1b;
          padding: 14px;
          border-radius: 8px;
          font-size: 9.5pt;
          line-height: 1.7;
          color: #e5e7eb;
        }

        .modal-story-title {
          font-size: 11pt;
          font-weight: 700;
          color: #ffffff;
          margin-bottom: 8px;
        }

        .empty-placeholder {
          text-align: center;
          color: #6b7280;
          padding: 40px 20px;
          font-size: 9pt;
          border: 1px dashed rgba(255, 255, 255, 0.08);
          border-radius: 16px;
        }
    </style>
</head>
<body>

    <audio id="bgAudio" preload="auto" loop src="song.mp3.mp3"></audio>

    <div class="phone-mockup">
        <div class="ambient-glow"></div>

        <div class="top-nav">
            <div class="nav-brand">أرشيف <span class="accent">الذاكرة</span></div>
            
            <div class="nav-controls">
                <div class="audio-pill" id="audioBtn" onclick="toggleAudio()">♪ الخلفية الصوتية</div>
                
                <!-- قائمة الثلاث نقاط -->
                <div class="menu-wrapper">
                    <div class="menu-btn" id="menuBtn" onclick="toggleMenu(event)">⋮</div>
                    <div class="dropdown-menu" id="dropdownMenu">
                        <p>للتواصل معنا:</p>
                        <!-- تم تحويل الإيميل إلى رابط قابل للضغط يفتح تطبيق البريد مباشرة -->

                        <hr>
                        <a href="https://forms.gle/z7C62xPRrSTyChJJ7" target="_blank" class="action-link">+ إضافة شهيد</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="editorial-hero">
            <div class="kicker">مشروع توثيق إعلامي</div>
            <div class="hero-heading">شهداؤنا<br>ليسوا أرقاماً</div>
            <div class="hero-quote">«اضغط على بطاقة أي شهيد لقراءة حكايته الكاملة.»</div>

        <div class="toolbar-area">
            <input type="text" id="searchInput" class="custom-input" placeholder="🔍 ابحث بالاسم، القصة، أو تاريخ الاستشهاد..." oninput="filterData()">
            <div class="chip-group">
                <div class="chip active" onclick="setFilter('الكل', this)">الكل</div>
                <div class="chip" onclick="setFilter('جنين', this)">جنين</div>
                <div class="chip" onclick="setFilter('نابلس', this)">نابلس</div>
                <div class="chip" onclick="setFilter('الخليل', this)">الخليل</div>
            </div>
        </div>

        <div class="feed-area" id="feedArea">
            <!-- سيتم تحميل البطاقات هنا تلقائياً -->
        </div>
    </div>

    <!-- نافذة التفاصيل المكبرة (Modal) -->
    <div class="modal-overlay" id="detailsModal" onclick="closeModalOnOuterClick(event)">
        <div class="modal-content">
            <button class="modal-close-btn" onclick="closeModal()">✕</button>
            <div class="modal-hero-img-box">
                <img id="mImg" src="" alt="" class="modal-hero-img">
            </div>
            <div class="modal-title" id="mName"></div>
            <div class="modal-nickname" id="mNickname"></div>

            <div class="modal-info-grid">
                <div class="modal-info-item"><span>تاريخ الميلاد:</span> <strong id="mBirth"></strong></div>
                <div class="modal-info-item"><span>تاريخ الاستشهاد:</span> <strong id="mDeath"></strong></div>
                <div class="modal-info-item"><span>المدينة / الموقع:</span> <strong id="mLoc"></strong></div>
                <div class="modal-info-item"><span>طريقة الاستشهاد:</span> <strong id="mHow"></strong></div>
            </div>

            <div class="modal-story-box">
                <div class="modal-story-title">📖 سيرة وحكاية الشهيد:</div>
                <div id="mStory"></div>
            </div>
        </div>
    </div>

    <script>
        const records = [
          {
            id: 1,
            name: "إبراهيم أحمد سعيد النابلسي",
            nickname: "أبو فتحي / أمير كتائب شهداء الأقصى",
            city: "نابلس",
            location: "البلدة القديمة - نابلس",
            image: "https://upload.wikimedia.org/wikipedia/ar/0/03/%D8%A5%D8%A8%D8%B1%D8%A7%D9%87%D9%8A%D9%85_%D8%A7%D9%84%D9%86%D8%A7%D8%A8%D9%84%D8%B3%D9%8A.jpg",
            birthDate: "2003/10/13",
            deathDate: "2022/08/09",
            howMartyred: "اشتباك مسلح عقب حصار منزل في البلدة القديمة",
            story: "شاب مطارد أربك أجهزة الاحتلال لشهور طويلة ونجا من عدة محاولات اغتيال. أصبح رمزاً للشباب المقاوم في نابلس وشكّل حالة نضالية فريدة حتى لحظة استشهاده رفقة رفيقه إسلام صبوح."
          },
          {
            id: 2,
            name: "محمود أحمد محمد طوالبة",
            nickname: "قائد معركة مخيم جنين 2002",
            city: "جنين",
            location: "مخيم جنين",
            image: "https://upload.wikimedia.org/wikipedia/ar/8/87/Mahmoud_Tawalbe.jpg",
            birthDate: "1979/11/02",
            deathDate: "2002/04/09",
            howMartyred: "اشتباك مباشر وتفجير منزل أثناء دفاعه عن المخيم",
            story: "القائد الميداني المباشر لمعركة مخيم جنين الشهيرة عام 2002. أدار غرفة عمليات المقاومة وواجه الدبابات والجرافات بحنكة عسكرية عالية وقاد الصمود حتى استشهاده."
          },
          {
            id: 3,
            name: "مروان خليل زلوم",
            nickname: "قائد كتائب شهداء الأقصى في الخليل",
            city: "الخليل",
            location: "شارع الشلالة - الخليل",
            image: "",
            birthDate: "1972/06/15",
            deathDate: "2002/04/22",
            howMartyred: "اغتيال بواسطة صواريخ طائرة أباتشي استهدفت سيارته",
            story: "من أوائل مؤسسي وصانعي المجموعات العسكرية في الخليل خلال انتفاضة الأقصى. خطط ونفذ عدة عمليات نوعية وكان مطارداً لفترة طويلة وقاد العمل المقاوم في المحافظة."
          },
          {
            id: 4,
            name: "عبد الله أنور حصري",
            nickname: "مؤسس في كتيبة جنين",
            city: "جنين",
            location: "مخيم جنين",
            image: "",
            birthDate: "1999/08/18",
            deathDate: "2022/03/01",
            howMartyred: "اشتباك مسلح مباشر أثناء تصديه للاقتحام",
            story: "أسير محرر ومقاوم بارز كان من الأوائل الذين أسسوا العمل الميداني والتصدّي للاقتحامات الليلية لمخيم جنين. اشتُهر بجرأته في المواجهة المباشرة من مسافات صفر."
          },
          {
            id: 5,
            name: "إسلام أحمد صبوح",
            nickname: "صقر البلدة القديمة",
            city: "نابلس",
            location: "البلدة القديمة - نابلس",
            image: "",
            birthDate: "2000/02/10",
            deathDate: "2022/08/09",
            howMartyred: "استشهد مقاتلاً برفقة إبراهيم النابلسي",
            story: "رفيق درب إبراهيم النابلسي، أحد أبرز المطاردين والمقاتلين في البلدة القديمة بنابلس. خاض المعركة الأخيرة حتى نفاد ذخيرته ولم يسلم نفسه رغم القصف المكثف."
          },
          {
            id: 6,
            name: "نسيم نايف سليم أبو فودة",
            nickname: "فارس الحرم الإبراهيمي",
            city: "الخليل",
            location: "المنطقة الجنوبية - الخليل",
            image: "",
            birthDate: "1997/04/25",
            deathDate: "2023/01/30",
            howMartyred: "إصابة بالرصاص الحي في الرأس عند حاجز عسكري",
            story: "شاب من سكان منطقة الحرم الإبراهيمي بالخليل، استُهدف بدم بارد أثناء مروره بسيارته قرب إحدى المكعبات الإسمنتية التي تقطع أوصال المدينة القديمة."
          }
        ];

        let currentCity = 'الكل';

        function getRandomRecords(arr, count) {
            const shuffled = [...arr].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, count);
        }

        function renderCards(data) {
            const feed = document.getElementById('feedArea');
            feed.innerHTML = '';

            if (data.length === 0) {
                feed.innerHTML = '<div class="empty-placeholder">لم يتم العثور على سجلات مطابقة لنص البحث.</div>';
                return;
            }

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'hero-card';
                card.onclick = () => openModal(item.id);

                const imageUrl = item.image && item.image.trim() !== "" 
                    ? item.image 
                    : "https://via.placeholder.com/150/1c1c24/888888?text=%D8%A7%D9%84%D8%B0%D8%A7%D9%83%D8%B1%D8%A9";

                card.innerHTML = `
                    <div class="card-top-section">
                        <div class="martyr-img-wrapper">
                            <img src="${imageUrl}" alt="${item.name}" class="martyr-img" onerror="this.src='https://via.placeholder.com/150/1c1c24/888888?text=%D8%A7%D9%84%D8%B0%D8%A7%D9%83%D8%B1%D8%A9'">
                        </div>
                        <div class="card-header-info">
                            <span class="card-tag">مدينة ${item.city}</span>
                            <div class="card-title-text">${item.name}</div>
                            ${item.nickname ? `<div class="card-nickname">• ${item.nickname}</div>` : ''}
                        </div>
                    </div>
                    <div class="view-more-btn">📖 اضغط لقراءة التفاصيل الكاملة</div>
                `;
                feed.appendChild(card);
            });
        }

        function openModal(id) {
            const item = records.find(r => r.id === id);
            if (!item) return;

            const imageUrl = item.image && item.image.trim() !== "" 
                ? item.image 
                : "https://via.placeholder.com/400x250/1c1c24/888888?text=%D8%A7%D9%84%D8%B0%D8%A7%D9%83%D8%B1%D8%A9";

            document.getElementById('mImg').src = imageUrl;
            document.getElementById('mName').innerText = item.name;
            document.getElementById('mNickname').innerText = item.nickname ? '• ' + item.nickname : '';
            document.getElementById('mBirth').innerText = item.birthDate || 'غير مدون';
            document.getElementById('mDeath').innerText = item.deathDate || 'غير مدون';
            document.getElementById('mLoc').innerText = item.location;
            document.getElementById('mHow').innerText = item.howMartyred;
            document.getElementById('mStory').innerText = item.story || 'لا توجد تفاصيل إضافية مدونة.';

            document.getElementById('detailsModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('detailsModal').classList.remove('active');
        }

        function closeModalOnOuterClick(e) {
            if (e.target.classList.contains('modal-overlay')) {
                closeModal();
            }
        }

        function toggleMenu(event) {
            event.stopPropagation();
            const menu = document.getElementById('dropdownMenu');
            menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
        }

        window.onclick = function(event) {
            const menu = document.getElementById('dropdownMenu');
            if (menu && menu.style.display === 'block') {
                menu.style.display = 'none';
            }
        };

        function updateDisplay() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();

            let cityFiltered = records;
            if (currentCity !== 'الكل') {
                cityFiltered = records.filter(r => r.city === currentCity);
            }

            if (query.length > 0) {
                const searchResults = cityFiltered.filter(item => 
                    item.name.toLowerCase().includes(query) ||
                    (item.nickname && item.nickname.toLowerCase().includes(query)) ||
                    item.location.toLowerCase().includes(query) ||
                    (item.story && item.story.toLowerCase().includes(query)) ||
                    item.deathDate.includes(query)
                );
                renderCards(searchResults);
            } else {
                const randomSelection = getRandomRecords(cityFiltered, 3);
                renderCards(randomSelection);
            }
        }

        function filterData() {
            updateDisplay();
        }

        function setFilter(city, element) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            currentCity = city;
            
            document.getElementById('searchInput').value = '';
            updateDisplay();
        }

        function toggleAudio() {
            const audio = document.getElementById('bgAudio');
            const btn = document.getElementById('audioBtn');

            if (audio.paused) {
                audio.load();
                let playPromise = audio.play();

                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        btn.classList.add('playing');
                        btn.innerText = '⏸ إيقاف الصوت';
                    }).catch(error => {
                        console.log(error);
                        alert('يرجى الضغط مرة أخرى لتأكيد تشغيل الصوت.');
                    });
                }
            } else {
                audio.pause();
                btn.classList.remove('playing');
                btn.innerText = '♪ الخلفية الصوتية';
            }
        }

        window.onload = function() {
            updateDisplay();
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شهداؤنا ليسوا أرقامًا | أرشيف التوثيق الفلسطيني</title>
    
    <!-- الخطوط العربية -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- مشغل الموسيقى/النشيد -->
    <audio id="bg-audio" loop preload="auto">
        <source src="background.mp3" type="audio/mpeg">
    </audio>

    <!-- الواجهة الافتتاحية -->
    <header class="hero-section">
        <div class="audio-control-container">
            <button id="audio-toggle" class="btn-audio">
                <span id="audio-icon">▶</span>
                <span id="audio-text">تشغيل الموسيقى</span>
            </button>
        </div>

        <div class="hero-content">
            <div class="symbol">🕊️</div>
            <h1 class="main-title">شهداؤنا ليسوا أرقامًا</h1>
            <p class="subtitle">«لكل اسم حكاية، ولكل شهيد ذاكرة لا تُنسى.»</p>
            <div class="gold-divider"></div>
        </div>

        <!-- إحصائية سريعة -->
        <div class="stats-badge">
            <span class="stats-label">عدد الشهداء الموثقين:</span>
            <span id="martyrs-count" class="stats-number">0</span>
        </div>
    </header>

    <!-- قسم البحث والتصفية -->
    <main class="main-container">
        <section class="filter-section">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="ابحث عن اسم الشهيد..." autocomplete="off">
            </div>
            
            <div class="select-box">
                <select id="region-filter">
                    <option value="all">كل فلسطين</option>
                    <option value="القدس">القدس الشريف</option>
                    <option value="جنين">جنين</option>
                    <option value="نابلس">نابلس</option>
                    <option value="غزة">قطاع غزة</option>
                    <option value="الخليل">الخليل</option>
                    <option value="رام الله">رام الله والبيرة</option>
                    <option value="طولكرم">طولكرم</option>
                    <option value="بيت لحم">بيت لحم</option>
                    <option value="أريحا">أريحا</option>
                    <option value="سلفيت">سلفيت</option>
                    <option value="قلقيلية">قلقيلية</option>
                    <option value="طوباس">طوباس</option>
                    <option value="الداخل">الداخل المحتل (48)</option>
                </select>
            </div>
        </section>

        <!-- شبكة عرض بطاقات الشهداء -->
        <section class="martyrs-grid" id="martyrs-grid">
            <!-- يتم تحميل البطاقات ديناميكيًا -->
        </section>
    </main>

    <!-- النافذة المنبثقة لتفاصيل الشهيد -->
    <div id="martyr-modal" class="modal-overlay" aria-hidden="true">
        <div class="modal-card">
            <button class="close-modal" id="close-modal">&times;</button>
            <div class="modal-body" id="modal-content">
                <!-- يتم تعبئة التفاصيل ديناميكيًا -->
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>أرشيف «شهداؤنا ليسوا أرقامًا» — توثيق حر لحفظ الذاكرة الوطنية الفلسطينية.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
